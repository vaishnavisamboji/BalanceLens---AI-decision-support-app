services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - EMBED_MODEL=sentence-transformers/all-MiniLM-L6-v2
      - LLM_MODEL=google/flan-t5-base
      - RAG_K=4
    volumes:
      - ./data:/app/data

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE=http://localhost:8000
    depends_on:
      - backend

